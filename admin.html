<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Production Schedule System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
  <nav class="bg-slate-900 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <div class="font-bold text-xl text-blue-400"><a href="index.html">PROD-SCHEDULER</a></div>
      <div class="flex space-x-2 text-sm">
        <a href="index.html" class="hover:bg-slate-800 py-2 px-3 rounded">Home</a>
        <a href="technical.html" class="hover:bg-slate-800 py-2 px-3 rounded">Technical</a>
        <a href="data.html" class="hover:bg-slate-800 py-2 px-3 rounded">Data</a>
        <a href="operator.html" class="hover:bg-slate-800 py-2 px-3 rounded">Operator Mode</a>
        <a href="overall.html" class="hover:bg-slate-800 py-2 px-3 rounded">Overall</a>
        <a href="preview.html" class="hover:bg-slate-800 py-2 px-3 rounded">Preview</a>
        <a href="admin.html" class="bg-blue-600 hover:bg-blue-700 py-2 px-4 rounded text-white font-semibold">Admin</a>
      </div>
    </div>
  </nav>

  <div class="max-w-[95%] mx-auto p-6">
    <div id="admin-login-box" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
      <h2 class="text-xl font-bold text-center text-gray-800 mb-4">Admin Login Panel</h2>
      <form onsubmit="event.preventDefault(); handleLogin();">
        <div class="mb-4">
          <label class="block text-sm text-gray-600 mb-1">Username</label>
          <input type="text" id="admin-username" class="w-full border rounded px-3 py-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm text-gray-600 mb-1">Password</label>
          <input type="password" id="admin-password" class="w-full border rounded px-3 py-2" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700">Login</button>
      </form>
    </div>

    <div id="admin-dashboard" class="hidden">
      <h1 class="text-2xl font-bold mb-4">Admin Control Dashboard</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- UPS & Color Form -->
        <div class="bg-white p-6 rounded-lg shadow-sm border-t-4 border-blue-600">
          <h3 class="text-lg font-bold mb-4 text-gray-800">1. UPS & Color Information Entry</h3>
          <form onsubmit="event.preventDefault(); submitUPSColor();" class="space-y-3 text-sm">
            <div><label class="block text-xs font-medium">S/L</label><input type="text" id="sl" class="border p-1.5 w-full rounded"></div>
            <div><label class="block text-xs font-medium">Assembly</label><input type="text" id="assembly" class="border p-1.5 w-full rounded"></div>
            <div><label class="block text-xs font-medium">Color</label><input type="text" id="color" class="border p-1.5 w-full rounded"></div>
            <div><label class="block text-xs font-medium">Machine</label><input type="text" id="machine" class="border p-1.5 w-full rounded"></div>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold hover:bg-blue-700">Save UPS Data</button>
          </form>
        </div>

        <!-- Job Listing Form -->
        <div class="bg-white p-6 rounded-lg shadow-sm border-t-4 border-indigo-600">
          <h3 class="text-lg font-bold mb-4 text-gray-800">2. Job Listing Entry</h3>
          <form onsubmit="event.preventDefault(); submitJobListing();" class="space-y-3 text-sm">
            <div><label class="block text-xs font-medium">Discrete Job</label><input type="text" id="discreteJob" class="border p-1.5 w-full rounded"></div>
            <div><label class="block text-xs font-medium">Customer</label><input type="text" id="customer" class="border p-1.5 w-full rounded"></div>
            <div><label class="block text-xs font-medium">Quantity</label><input type="number" id="quantity" class="border p-1.5 w-full rounded"></div>
            <div><label class="block text-xs font-medium">Job Status</label><input type="text" id="jobStatus" class="border p-1.5 w-full rounded"></div>
            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded font-semibold hover:bg-indigo-700">Save Job Listing</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function handleLogin() {
      const u = document.getElementById('admin-username').value;
      const p = document.getElementById('admin-password').value;
      if (u === "admin" && p === "admin123") {
        document.getElementById('admin-login-box').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
      } else {
        alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
      }
    }

    async function submitUPSColor() {
      const payload = {
        sl: document.getElementById('sl').value,
        assembly: document.getElementById('assembly').value,
        color: document.getElementById('color').value,
        machine: document.getElementById('machine').value
      };
      const { error } = await db.from('ups_color').insert([payload]);
      if (error) alert("Error: " + error.message);
      else alert("UPS Data Saved Successfully!");
    }

    async function submitJobListing() {
      const payload = {
        discreteJob: document.getElementById('discreteJob').value,
        customer: document.getElementById('customer').value,
        quantity: document.getElementById('quantity').value,
        jobStatus: document.getElementById('jobStatus').value
      };
      const { error } = await db.from('job_listings').insert([payload]);
      if (error) alert("Error: " + error.message);
      else alert("Job Listing Saved Successfully!");
    }
  </script>
</body>
</html>
