<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview - Production Schedule System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
  <nav class="bg-slate-900 text-white shadow-lg print:hidden">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <div class="font-bold text-xl text-blue-400"><a href="index.html">PROD-SCHEDULER</a></div>
      <div class="flex space-x-2 text-sm">
        <a href="index.html" class="hover:bg-slate-800 py-2 px-3 rounded">Home</a>
        <a href="technical.html" class="hover:bg-slate-800 py-2 px-3 rounded">Technical</a>
        <a href="data.html" class="hover:bg-slate-800 py-2 px-3 rounded">Data</a>
        <a href="operator.html" class="hover:bg-slate-800 py-2 px-3 rounded">Operator Mode</a>
        <a href="overall.html" class="hover:bg-slate-800 py-2 px-3 rounded">Overall</a>
        <a href="preview.html" class="bg-slate-800 py-2 px-3 rounded text-blue-400">Preview</a>
        <a href="admin.html" class="bg-blue-600 hover:bg-blue-700 py-2 px-4 rounded text-white font-semibold">Admin</a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto p-8 bg-white shadow-lg rounded-lg mt-6">
    <div class="flex justify-between items-center border-b pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">DAILY PRODUCTION SCHEDULE REPORT</h1>
        <p class="text-sm text-gray-500">ATMA & Sakurai Screen Printing Section</p>
      </div>
      <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold print:hidden">Print Schedule</button>
    </div>

    <div id="printTableContainer" class="text-sm">Loading Preview Sheet...</div>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadPrintPreview() {
      const { data: jobData } = await db.from('job_listings').select('*');
      let html = `<table class="w-full border-collapse border border-gray-300 text-left">
        <thead>
          <tr class="bg-gray-100 border-b">
            <th class="border p-2">Discrete Job</th>
            <th class="border p-2">Customer</th>
            <th class="border p-2">Planned Qty</th>
            <th class="border p-2">Status</th>
          </tr>
        </thead>
        <tbody>`;
      if (jobData && jobData.length > 0) {
        jobData.forEach(row => {
          html += `<tr>
            <td class="border p-2">${row.discreteJob || ''}</td>
            <td class="border p-2">${row.customer || ''}</td>
            <td class="border p-2">${row.quantity || ''}</td>
            <td class="border p-2">${row.jobStatus || ''}</td>
          </tr>`;
        });
      }
      html += `</tbody></table>`;
      document.getElementById('printTableContainer').innerHTML = html;
    }
    loadPrintPreview();
  </script>
</body>
</html>
